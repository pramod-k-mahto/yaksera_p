services:
  backend:
    build: ./backend
    ports:
      - "9000:9000"
    env_file:
      - ./backend/.env
    networks:
      - yaksera_network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    env_file:
     - ./frontend/.env
    networks:
      - yaksera_network

networks:
  yaksera_network:
    driver: bridge